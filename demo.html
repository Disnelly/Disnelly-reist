<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Reisverslagen</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:       #1a1612;
            --warm:      #f5f0e8;
            --accent:    #b5652a;
            --accent2:   #2a6e8c;
            --muted:     #7a6f65;
            --card-bg:   #fffcf7;
            --border:    #e2d9cc;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--warm);
            color: var(--ink);
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            background: var(--ink);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-name {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--warm);
            letter-spacing: 0.04em;
            cursor: pointer;
        }

        .site-name span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            color: rgba(245,240,232,0.7);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active { color: var(--warm); }

        /* ── HERO ── */
        .hero {
            height: 480px;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .hero-eyebrow {
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
            position: relative;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(42px, 6vw, 72px);
            color: var(--warm);
            line-height: 1.1;
            position: relative;
        }

        .hero h1 em {
            color: var(--accent);
            font-style: italic;
        }

        .hero-sub {
            margin-top: 20px;
            font-size: 15px;
            color: rgba(245,240,232,0.6);
            font-weight: 300;
            letter-spacing: 0.05em;
            position: relative;
        }

        .scroll-hint {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(245,240,232,0.4);
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .scroll-hint::after {
            content: '';
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, rgba(245,240,232,0.4), transparent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

        /* ── CONTINENT GRID ── */
        #home-view { padding: 64px 40px; }

        .section-label {
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--ink);
            margin-bottom: 40px;
        }

        .continent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .continent-card {
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            aspect-ratio: 3/2;
            box-shadow: 0 4px 24px rgba(26,22,18,0.15);
            transition: transform 0.35s cubic-bezier(.22,.68,0,1.1), box-shadow 0.35s;
        }

        .continent-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(26,22,18,0.25);
        }

        .continent-card-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .continent-card:hover .continent-card-bg { transform: scale(1.06); }

        .continent-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(26,22,18,0.88) 0%, rgba(26,22,18,0.1) 55%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
        }

        .continent-card-count {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .continent-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--warm);
            margin-bottom: 4px;
        }

        .continent-card-desc {
            font-size: 13px;
            color: rgba(245,240,232,0.65);
            font-weight: 300;
        }

        .continent-card-arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(245,240,232,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.25s, transform 0.25s;
        }

        .continent-card:hover .continent-card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* ── STORIES LIST ── */
        #stories-view { padding: 48px 40px; max-width: 1200px; margin: 0 auto; }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 36px;
        }

        .breadcrumb span { cursor: pointer; }
        .breadcrumb span:hover { color: var(--accent); }
        .breadcrumb .sep { color: var(--border); }
        .breadcrumb .current { color: var(--ink); font-weight: 700; }

        .continent-banner {
            display: flex;
            align-items: flex-end;
            gap: 0;
            margin-bottom: 48px;
            height: 200px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .continent-banner-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.5);
        }

        .continent-banner-text {
            position: relative;
            padding: 28px 32px;
        }

        .continent-banner-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: white;
        }

        .continent-banner-text p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-top: 4px;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
        }

        .story-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.25s, transform 0.25s;
        }

        .story-card:hover {
            box-shadow: 0 12px 40px rgba(26,22,18,0.12);
            transform: translateY(-4px);
        }

        .story-card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: var(--border);
        }

        .story-card-body { padding: 20px 24px 24px; }

        .story-card-date {
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .story-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--ink);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .story-card-excerpt {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            font-weight: 300;
        }

        .story-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-top: 1px solid var(--border);
        }

        .story-card-loc {
            font-size: 12px;
            color: var(--muted);
        }

        .story-card-link {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ── STORY DETAIL ── */
        #story-view { max-width: 1100px; margin: 0 auto; padding: 48px 40px; }

        .story-hero-img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 40px;
            display: block;
            background: var(--border);
        }

        .story-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .story-meta-date {
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .story-meta-loc {
            font-size: 12px;
            color: var(--muted);
        }

        .story-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 4vw, 48px);
            line-height: 1.15;
            color: var(--ink);
            margin-bottom: 32px;
        }

        .story-body {
            font-size: 17px;
            line-height: 1.85;
            color: #2e2a26;
            font-weight: 300;
            max-width: 700px;
            white-space: pre-wrap;
        }

        .story-body p { margin-bottom: 1.5em; }

        /* ── PHOTO GALLERY ── */
        .gallery-section {
            margin-top: 56px;
            padding-top: 40px;
            border-top: 1px solid var(--border);
        }

        .gallery-label {
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .gallery-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--ink);
            margin-bottom: 24px;
        }

        .gallery-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 16px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }

        .gallery-strip:active { cursor: grabbing; }

        .gallery-strip::-webkit-scrollbar { height: 4px; }
        .gallery-strip::-webkit-scrollbar-track { background: var(--border); border-radius: 2px; }
        .gallery-strip::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .gallery-thumb {
            flex-shrink: 0;
            width: 220px;
            height: 160px;
            object-fit: cover;
            border-radius: 3px;
            scroll-snap-align: start;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            background: var(--border);
            display: block;
        }

        .gallery-thumb:hover { opacity: 0.85; transform: scale(1.02); }

        /* ── LIGHTBOX ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,8,6,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.open { display: flex; }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 2px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6);
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 28px;
            color: rgba(245,240,232,0.6);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
            background: none;
            border: none;
        }

        .lightbox-close:hover { color: white; }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(245,240,232,0.1);
            border: 1px solid rgba(245,240,232,0.2);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lightbox-nav:hover { background: rgba(245,240,232,0.2); }
        .lightbox-prev { left: 24px; }
        .lightbox-next { right: 24px; }

        .lightbox-counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(245,240,232,0.5);
            font-size: 13px;
            letter-spacing: 0.1em;
        }

        /* ── UTILITIES ── */
        .hidden { display: none !important; }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            margin-bottom: 32px;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
            transition: color 0.2s;
        }

        .btn-back:hover { color: var(--accent); }

        @media (max-width: 700px) {
            header { padding: 0 20px; }
            #home-view, #stories-view, #story-view { padding: 40px 20px; }
            nav { gap: 16px; }
        }
    </style>
</head>

<script>
/* ── CONTINENTEN ──────────────────────────────
   bg: pad naar je afbeelding, bijv. "Images/zuidamerika.jpg"
   verhaalIds: welke verhalen horen bij dit continent (op id)
──────────────────────────────────────────── */
const continenten = [
    {
        id: 0,
        titel: "Zuid-Amerika",
        beschrijving: "Avonturen tussen de Andes en de Amazone",
        bg: "Images/sudamerica.jpg",
        verhaalIds: [1, 2]
    },
    {
        id: 1,
        titel: "Noord-Amerika",
        beschrijving: "Steden, natuur en open wegen",
        bg: "Images/norteamerica.jpg",
        verhaalIds: [3]
    },
    {
        id: 2,
        titel: "Azië",
        beschrijving: "Tempels, markten en eindeloze contrasten",
        bg: "Images/asia.jpg",
        verhaalIds: []
    },
    {
        id: 3,
        titel: "Europa",
        beschrijving: "Dichtbij en toch altijd verassend",
        bg: "Images/europa.jpg",
        verhaalIds: []
    },
    {
        id: 4,
        titel: "Afrika",
        beschrijving: "Wildheid, kleur en onvergetelijke mensen",
        bg: "Images/africa.jpg",
        verhaalIds: []
    }
];

/* ── VERHALEN ─────────────────────────────────
   hoofdfoto:  pad naar de hoofdfoto van het verhaal
   fotos:      array met paden naar de galerij-foto's (max ~15)
   tekst:      plak hier je Word-tekst tussen de backticks `...`
               Gebruik een lege regel voor een nieuwe alinea.
──────────────────────────────────────────── */
const verhalen = [
    {
        id: 1,
        continent: 0,
        titel: "Verloren in Patagonia",
        locatie: "Chili & Argentinië",
        datum: "Maart 2024",
        samenvatting: "Drie weken wandelen door een landschap dat je adem wegneemt — letterlijk.",
        hoofdfoto: "Images/Sudamerica.jpg",
        fotos: [
            "Images/patagonie1.jpg",
            "Images/patagonie2.jpg",
            "Images/patagonie3.jpg",
            "Images/patagonie4.jpg",
            "Images/patagonie5.jpg"
        ],
        tekst: `Het begon met een bus die twee uur te laat was en eindigde met een zonsondergang die ik nooit zal vergeten.

Patagonia is niet zomaar een bestemming. Het is een toestand. De wind daar is levend — hij duwt, trekt en fluistert iets wat je niet helemaal begrijpt maar wel voelt.

We arriveerden in Puerto Natales na een lange nacht in de bus vanuit Santiago. De stad zelf is klein, rustig, met houten huizen die eruitzien alsof ze elk moment door de wind meegenomen kunnen worden. Maar niemand leek zich daar druk over te maken.

De eerste dag in Torres del Paine liepen we zes uur door een landschap dat onwerkelijk aanvoelde. Turquoise meren, gletsjers die langzaam in het water gleden, condors die hoog boven ons zweefden.

Ik dacht vaak: dit bestaat niet echt. Maar mijn benen wisten wel beter.

Plak hier de rest van je verhaal...`
    },
    {
        id: 2,
        continent: 3,
        titel: "Taj Mahal",
        locatie: "India",
        datum: "Februari 2024",
        samenvatting: "Een week dwalen door de wijken van de stad die nooit slaapt.",
        hoofdfoto: "Images/India_1.jpg",
        fotos: [
            "Images/India_1.jpg",
            "Images/India_2.jpg",
            "Images/India_3.jpg"
            "Images/India_4.jpg",
            "Images/India_5.jpg"
        ],
        tekst: `De voorkant van een boek die werkelijkheid werd

        Soms beginnen dromen op de meest onverwachte plaatsen. Voor mij begon alles op de voorkant van een wiskundeboek dat ik in mijn handen had toen ik klein was. Op de voorkant stond een foto van de Taj Mahal. Deze plek was als een sprookje. De Taj Mahal is een indrukwekkend mausoleum dat in de stad van Agra ligt, in India. Het is een van de mooiste voorbeelden van architectuur ter wereld. De Taj Mahal werd in XVII eeuw gebouwd door de keizer Shan Jahan. Hij wilde een monument bouwen om zijn favoriete vrouw te herinneren. Helaas stierf zijn vrouw tijdens de bevalling van hun 14de zoon. Daarom geloven veel mensen dat het mausoleum een symbool van eeuwige liefde is. De structuur heeft een perfecte symmetrie, een majestueuze koepel en een geweldige combinatie van edelsteen en wit marmer.
        Mijn man en ik wilden het ochtendgloren kunnen bewonderen omdat wij hadden gehoord dat de kleur van het mausoleum met het licht verandert. Daarom arriveerden wij vroeg in de ochtend op deze plek. Wij keken met spanning naar dit spektakel uit. Toen het zo ver was, werd de schoonheid van de zonsopgang in het witte marmer van het mausoleum weerspiegeld. Ook werd de koepel weerspiegeld in het water. Het was fantastisch!
        Na de zonsopgang, probeerden we mooie foto’s te maken en wandelden we door de elegante tuinen. In de tuinen waren mooie bloemen en ook apenfamilies.  De apen sprongen tussen de bomen en ze gaven ons grappige momenten. Daarna bezochten wij het interieur van het mausoleum. De sfeer was er heel rustig en ceremonieel. Er waren op sommige muren islamitische teksten te zien. De plek heeft een kalme en speciale energie. 
        Er zijn prachtige metaforen in het leven. Mensen zeggen vaak dat boeken je nieuwe plaatsen laten zien en dat je met hen kunt reizen zonder te verplaatsen. Ik had nooit gedacht dat de voorkant van een boek waar ik zo vaak naar keek terwijl ik wiskunde studeerde, op een dag recht voor mij zou staan.`
    },
    {
        id: 3,
        continent: 1,
        titel: "Roadtrip door Canada",
        locatie: "Canada",
        datum: "Juli 2023",
        samenvatting: "Van Vancouver tot Toronto — 5000 kilometer en evenveel herinneringen.",
        hoofdfoto: "Images/canada.jpg",
        fotos: [
            "Images/canada1.jpg",
            "Images/canada2.jpg"
        ],
        tekst: `Plak hier je verhaal...`
    }
];
</script>

<body>

<!-- HEADER -->
<header>
    <div class="site-name" onclick="showHome()">Mijn <span>Reizen</span></div>
    <nav>
        <a onclick="showHome()" id="nav-home" class="active">Home</a>
        <a onclick="showHome()">Verhalen</a>
        <a>Over mij</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero" id="main-hero">
    <p class="hero-eyebrow">Persoonlijke reisverslagen</p>
    <h1>De wereld,<br><em>één verhaal</em> tegelijk</h1>
    <p class="hero-sub">Geschreven in het Nederlands · Foto's onderweg</p>
    <div class="scroll-hint">Ontdek</div>
</section>

<!-- HOME: continent grid -->
<div id="home-view">
    <div style="max-width:1200px; margin:0 auto;">
        <p class="section-label">Kies een bestemming</p>
        <h2 class="section-title">Waar ben ik geweest?</h2>
        <div class="continent-grid" id="continent-grid"></div>
    </div>
</div>

<!-- STORIES LIST -->
<div id="stories-view" class="hidden">
    <button class="btn-back" onclick="showHome()">← Alle continenten</button>
    <div class="continent-banner" id="continent-banner">
        <div class="continent-banner-bg" id="continent-banner-bg"></div>
        <div class="continent-banner-text">
            <h2 id="continent-banner-titel"></h2>
            <p id="continent-banner-desc"></p>
        </div>
    </div>
    <div class="stories-grid" id="stories-grid"></div>
</div>

<!-- STORY DETAIL -->
<div id="story-view" class="hidden">
    <button class="btn-back" id="story-back-btn">← Terug naar verhalen</button>
    <img id="story-hero-img" class="story-hero-img" src="" alt="">
    <div class="story-meta">
        <span class="story-meta-date" id="story-datum"></span>
        <span class="story-meta-loc" id="story-locatie"></span>
    </div>
    <h1 class="story-title" id="story-titel"></h1>
    <div class="story-body" id="story-tekst"></div>

    <!-- GALLERY -->
    <div class="gallery-section" id="gallery-section">
        <p class="gallery-label">Foto's</p>
        <h3 class="gallery-title">Beelden van de reis</h3>
        <div class="gallery-strip" id="gallery-strip"></div>
    </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)">‹</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)">›</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>
/* ═══════════ STATE ═══════════ */
let huidigContinent = null;
let huidigVerhaal   = null;
let lightboxFotos   = [];
let lightboxIndex   = 0;

/* ═══════════ INIT ═══════════ */
window.onload = () => {
    renderContinenten();
};

/* ═══════════ VIEWS ═══════════ */
function showHome() {
    document.getElementById('main-hero').classList.remove('hidden');
    document.getElementById('home-view').classList.remove('hidden');
    document.getElementById('stories-view').classList.add('hidden');
    document.getElementById('story-view').classList.add('hidden');
}

function showStories(continentId) {
    huidigContinent = continentId;
    const cont = continenten.find(c => c.id === continentId);
    document.getElementById('main-hero').classList.add('hidden');
    document.getElementById('home-view').classList.add('hidden');
    document.getElementById('stories-view').classList.remove('hidden');
    document.getElementById('story-view').classList.add('hidden');

    document.getElementById('continent-banner-bg').style.backgroundImage = `url('${cont.bg}')`;
    document.getElementById('continent-banner-titel').textContent = cont.titel;
    document.getElementById('continent-banner-desc').textContent = cont.beschrijving;

    renderVerhalen(cont);
}

function showStory(verhaalId) {
    const v = verhalen.find(x => x.id === verhaalId);
    huidigVerhaal = v;

    document.getElementById('stories-view').classList.add('hidden');
    document.getElementById('story-view').classList.remove('hidden');

    document.getElementById('story-hero-img').src = v.hoofdfoto;
    document.getElementById('story-hero-img').alt = v.titel;
    document.getElementById('story-datum').textContent = v.datum;
    document.getElementById('story-locatie').textContent = '📍 ' + v.locatie;
    document.getElementById('story-titel').textContent = v.titel;

    // Tekst: splits op lege regels → alinea's
    const alineas = v.tekst.trim().split(/\n\n+/);
    document.getElementById('story-tekst').innerHTML =
        alineas.map(a => `<p>${a.trim().replace(/\n/g, '<br>')}</p>`).join('');

    // Back button
    document.getElementById('story-back-btn').onclick = () => showStories(huidigContinent);

    // Galerie
    renderGalerij(v.fotos);

    window.scrollTo(0, 0);
}

/* ═══════════ RENDER ═══════════ */
function renderContinenten() {
    const grid = document.getElementById('continent-grid');
    grid.innerHTML = '';
    continenten.forEach(c => {
        const aantalVerhalen = c.verhaalIds.length;
        const el = document.createElement('div');
        el.className = 'continent-card';
        el.innerHTML = `
            <div class="continent-card-bg" style="background-image:url('${c.bg}')"></div>
            <div class="continent-card-overlay">
                <p class="continent-card-count">${aantalVerhalen} ${aantalVerhalen === 1 ? 'verhaal' : 'verhalen'}</p>
                <h3 class="continent-card-title">${c.titel}</h3>
                <p class="continent-card-desc">${c.beschrijving}</p>
            </div>
            <div class="continent-card-arrow">→</div>
        `;
        el.onclick = () => showStories(c.id);
        grid.appendChild(el);
    });
}

function renderVerhalen(cont) {
    const grid = document.getElementById('stories-grid');
    grid.innerHTML = '';
    const lijst = verhalen.filter(v => cont.verhaalIds.includes(v.id));

    if (lijst.length === 0) {
        grid.innerHTML = `<p style="color:var(--muted);font-style:italic;grid-column:1/-1;">
            Nog geen verhalen voor dit continent. Komt binnenkort!
        </p>`;
        return;
    }

    lijst.forEach(v => {
        const el = document.createElement('div');
        el.className = 'story-card';
        el.innerHTML = `
            <img class="story-card-img" src="${v.hoofdfoto}" alt="${v.titel}" onerror="this.style.background='var(--border)'">
            <div class="story-card-body">
                <p class="story-card-date">${v.datum}</p>
                <h3 class="story-card-title">${v.titel}</h3>
                <p class="story-card-excerpt">${v.samenvatting}</p>
            </div>
            <div class="story-card-footer">
                <span class="story-card-loc">📍 ${v.locatie}</span>
                <span class="story-card-link">Lees meer →</span>
            </div>
        `;
        el.onclick = () => showStory(v.id);
        grid.appendChild(el);
    });
}

function renderGalerij(fotos) {
    const strip = document.getElementById('gallery-strip');
    strip.innerHTML = '';

    if (!fotos || fotos.length === 0) {
        document.getElementById('gallery-section').classList.add('hidden');
        return;
    }

    document.getElementById('gallery-section').classList.remove('hidden');
    lightboxFotos = fotos;

    fotos.forEach((src, i) => {
        const img = document.createElement('img');
        img.className = 'gallery-thumb';
        img.src = src;
        img.alt = `Foto ${i + 1}`;
        img.onclick = () => openLightbox(i);
        strip.appendChild(img);
    });

    // Drag to scroll
    let isDown = false, startX, scrollLeft;
    strip.addEventListener('mousedown', e => {
        isDown = true; startX = e.pageX - strip.offsetLeft; scrollLeft = strip.scrollLeft;
    });
    strip.addEventListener('mouseleave', () => isDown = false);
    strip.addEventListener('mouseup', () => isDown = false);
    strip.addEventListener('mousemove', e => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - strip.offsetLeft;
        strip.scrollLeft = scrollLeft - (x - startX) * 1.5;
    });
}

/* ═══════════ LIGHTBOX ═══════════ */
function openLightbox(index) {
    lightboxIndex = index;
    document.getElementById('lightbox').classList.add('open');
    updateLightbox();
    document.addEventListener('keydown', lightboxKey);
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.removeEventListener('keydown', lightboxKey);
}

function lightboxNav(dir) {
    lightboxIndex = (lightboxIndex + dir + lightboxFotos.length) % lightboxFotos.length;
    updateLightbox();
}

function updateLightbox() {
    document.getElementById('lightbox-img').src = lightboxFotos[lightboxIndex];
    document.getElementById('lightbox-counter').textContent =
        `${lightboxIndex + 1} / ${lightboxFotos.length}`;
}

function lightboxKey(e) {
    if (e.key === 'ArrowRight') lightboxNav(1);
    if (e.key === 'ArrowLeft')  lightboxNav(-1);
    if (e.key === 'Escape')     closeLightbox();
}

document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeLightbox();
});
</script>

</body>
</html>
